# Ограничения брокера под инстанс на 1 GB (VM.Standard.E2.1.Micro).
#
# Монтируется в /etc/rabbitmq/conf.d/, а не поверх /etc/rabbitmq/rabbitmq.conf:
# conf.d — штатная точка расширения образа, базовый конфиг остаётся на месте.
#
# Переменными окружения это больше не настраивается: в RabbitMQ 3.13 остался
# только файл.

# По умолчанию брокер готов занять 40% памяти хоста под неотданные сообщения —
# на 1 GB это ~400 MB, которые тут отнимаются у MySQL. Очередь коротких JSON-строк
# столько не требует: 96 MiB хватает с большим запасом, а по достижении потолка
# RabbitMQ применяет back pressure к публикующим, а не падает.
vm_memory_high_watermark.absolute = 96MiB

# Ниже этого свободного места на диске брокер перестаёт принимать публикации.
# Дефолт (50 MB) на инстансе с 50 GB диска слишком оптимистичен: место кончится
# раньше, чем это сработает как предупреждение.
disk_free_limit.absolute = 500MB
