version: '3.8'
services:
  ## PHP-бот
  php:
    build: ./php
    container_name: php-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      # `php -S` без этой переменной обрабатывает запросы строго по одному:
      # вебхук, ждущий Gemini, задерживал и запросы Mini App к api.php.
      - PHP_CLI_SERVER_WORKERS=4
      - RABBITMQ_HOST=rabbitmq
    volumes:
      - ./php:/var/www/html
      - ./data:/var/www/data
    depends_on:
      - mysql
    ports:
      - "8081:80"

  ## Потребитель очереди трат: тот же образ, другая команда.
  ##
  ## Пока init не записал config.txt, Cfg падает на отсутствующем GEMINI_API_KEY
  ## и контейнер перезапускается — это нормально для первых секунд после `up`.
  worker:
    build: ./php
    container_name: expense-worker
    restart: unless-stopped
    command: php bin/worker.php
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - RABBITMQ_HOST=rabbitmq
      # Минимальная пауза между обращениями к Gemini. Ключ один на всех, лимит
      # у него на ключ — выставить под свой тариф. 0 снимает ограничение.
      - GEMINI_MIN_INTERVAL_MS=${GEMINI_MIN_INTERVAL_MS:-4000}
    volumes:
      - ./php:/var/www/html
      - ./data:/var/www/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_started

  ## RabbitMQ
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      # Веб-морда: смотреть очереди, вручную публиковать сообщения, проверять
      # отложенные повторы. В проде плагина нет — он стоит памяти.
      - "15672:15672"
    healthcheck:
      # Именно check_port_connectivity, а не ping: ping отвечает, пока брокер
      # ещё не принимает соединения на 5672, и воркер стартует в отказ.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ## MySQL
  mysql:
    image: mysql:5.7
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: telegram_bot
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_INITDB_SKIP_TZINFO: '1'
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./php/database:/docker-entrypoint-initdb.d

  ## Adminer
  adminer:
    image: adminer
    container_name: adminer-ui
    restart: always
    depends_on:
      - mysql
    ports:
      - "8080:8080"

  ## ngrok
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    depends_on:
      - php
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http php:80 --log-level debug --log-format json
    ports:
      - "4040:4040"

  ## init‑скрипт (установка webhook и запись в config.txt)
  init:
    image: curlimages/curl:latest
    container_name: init-script
    user: root
    depends_on:
      - ngrok
      - php
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./php:/var/www/html
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache jq

        echo ">> Ожидаем HTTPS ngrok URL..."
        for i in $$(seq 1 30); do
          URL=$$(curl -s http://ngrok:4040/api/tunnels \
            | jq -r '.tunnels[] | select(.proto=="https") | .public_url')

          if [ -n "$$URL" ] && [ "$$URL" != "null" ]; then
            break
          fi
          sleep 2
        done

        if [ -z "$$URL" ] || [ "$$URL" = "null" ]; then
          echo "ERROR: Не удалось получить HTTPS URL от ngrok"
          exit 1
        fi

        echo ">> Получен ngrok URL: $$URL"

        echo ">> Устанавливаем Telegram webhook..."
        curl -s -X POST \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
          -d "url=$$URL" > /tmp/sethook.json
        echo ">> Webhook response: $$(cat /tmp/sethook.json)"

        echo ">> Устанавливаем кнопку меню бота..."
        curl -s -X POST \
          "https://api.telegram.org/bot$$TELEGRAM_BOT_TOKEN/setChatMenuButton" \
          -H "Content-Type: application/json" \
          -d "{\"menu_button\":{\"type\":\"web_app\",\"text\":\"Расходы\",\"web_app\":{\"url\":\"$$URL/webapp/\"}}}" \
          > /tmp/setmenu.json
        echo ">> Menu button response: $$(cat /tmp/setmenu.json)"

        echo ">> Записываем URL в config.txt..."
        echo "WEBAPP_URL=$$URL/webapp/" > /var/www/html/config.txt
        echo "TELEGRAM_BOT_TOKEN=$$TELEGRAM_BOT_TOKEN" >> /var/www/html/config.txt
        echo "GEMINI_API_KEY=$$GEMINI_API_KEY" >> /var/www/html/config.txt

volumes:
  mysql_data: